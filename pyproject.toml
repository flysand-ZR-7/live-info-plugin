[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "live-info-plugin"
version = "1.0.0"
description = "Production-grade, secure web search and live information plugin for AI agents and LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "flysand-ZR-7" }
]
keywords = [
    "ai",
    "agents",
    "search",
    "searxng",
    "fastapi",
    "llm",
    "rag",
    "fact-verification",
    "ssrf-protection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "trafilatura>=1.9.0",
    "anthropic>=0.28.0",
    "openai>=1.35.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.1",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/flysand-ZR-7/live-info-plugin"
Repository = "https://github.com/flysand-ZR-7/live-info-plugin.git"
Issues = "https://github.com/flysand-ZR-7/live-info-plugin/issues"
