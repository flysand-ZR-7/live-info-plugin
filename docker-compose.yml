version: '3.8'

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=change_me_to_a_random_secret_in_production_32bytes
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  live-info:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: live-info-plugin
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - SEARXNG_URL=http://searxng:8080
      - LLM_PROVIDER=anthropic
      - LLM_API_KEY=${LLM_API_KEY:-}
    depends_on:
      - searxng
